<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Pi Control · Social card artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body { background: #f4f6fb; color: #17213a; font-family: Arial, Helvetica, sans-serif; }
    .art { position: relative; width: 1280px; height: 640px; overflow: hidden;
      background: radial-gradient(ellipse at 79% 43%, #dce5ff 0, #e9effc 29%, #f4f6fb 63%); }
    .grid { position: absolute; inset: 0; opacity: .3;
      background-image: linear-gradient(#c5cfe130 1px, transparent 1px), linear-gradient(90deg, #c5cfe130 1px, transparent 1px);
      background-size: 40px 40px; mask-image: linear-gradient(90deg, transparent 30%, #000 100%); }
    header { position: absolute; left: 64px; top: 49px; display: flex; align-items: center; gap: 13px; }
    .mark { display: grid; place-items: center; background: #465deb; color: #fff; border-radius: 13px; width: 43px; height: 43px; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; color: #586780; }
    .copy { position: absolute; z-index: 2; left: 60px; top: 161px; }
    h1 { margin: 0; font-size: 112px; line-height: .92; font-weight: 750; letter-spacing: -7.5px; }
    h1 span { color: #465deb; }
    .subtitle { margin: 28px 0 0 4px; font-size: 24px; line-height: 1.45; letter-spacing: -.6px; color: #556078; }
    .features { position: absolute; left: 64px; bottom: 91px; display: flex; align-items: center; gap: 20px; color: #313c54; font-size: 14px; font-weight: 600; }
    .features span { display: flex; align-items: center; gap: 7px; }
    .features svg { color: #65738d; width: 17px; height: 17px; stroke-width: 1.7; }
    footer { position: absolute; left: 64px; right: 64px; bottom: 32px; border-top: 1px solid #ccd5e4; padding-top: 17px; display: flex; justify-content: space-between; color: #6e7a90; font-size: 12px; letter-spacing: .3px; }
    #model { position: absolute; width: 750px; height: 637px; left: 518px; top: -20px; }
    body > :not(main):not(script) { display: none !important; }
    html > :not(head):not(body) { display: none !important; }
    #immersive-translate-popup { visibility: hidden !important; }
    .cube-webgl { width: 100%; height: 100%; display: block; outline: none; }
    .caption { position: absolute; top: 59px; right: 62px; font-size: 11px; letter-spacing: 1.4px; color: #79859b; }
  </style>
</head>
<body>
  <main class="art">
    <div class="grid"></div>
    <header><div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div><div class="eyebrow">OPEN SOURCE · RASPBERRY PI</div></header>
    <div class="copy"><h1>Pi<br><span>Control.</span></h1><p class="subtitle">Your lights. Your fans. Your display.<br>One beautiful control center.</p></div>
    <div id="model"></div>
    <div class="caption">CUBE PI · DIGITAL TWIN</div>
    <div class="features">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 9 5v8l-9 5-9-5V8Z M3 8l9 5 9-5 M12 13v8"/></svg>3D overview</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0l-1 2H9Z"/></svg>RGB</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h5m-5 4h10"/></svg>OLED</span>
    </div>
    <footer><span>REAL HARDWARE. LIVE PREVIEW.</span><span>picontrol.rikolab.com ↗</span></footer>
  </main>
  <script type="module" src="/promo/og-card.ts"></script>
</body>
</html>
