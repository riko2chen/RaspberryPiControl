name: Test
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npm run build && npm run build:demo
        working-directory: frontend
      - run: python -m pytest -q
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: docker compose config --quiet && docker compose build && docker compose up -d --wait
      - run: python scripts/smoke-service.py http://127.0.0.1:8080
      - run: python scripts/smoke-auth-container.py
      - if: always()
        run: docker compose down
